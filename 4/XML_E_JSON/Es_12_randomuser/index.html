<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>randomUser</title>
	<link rel="stylesheet" href="index.css">
    <script type="application/javascript" src="./data/people.js"></script>
    <script defer type="application/javascript" src="./index.js"></script>	
</head>

<body>
    <h1 style="text-align: center;">Anagrafica Comunale</h1>
	
	<div id="optWrapper">
		<input type="radio" name="gender" id="optMale" value="male" checked >  male  <br>
		<input type="radio" name="gender" id="optFemale" value="female"> female <br>
	</div>
	
	<table class="list">	
		<thead>
			<tr>
				<th width="25%"> Name </th>
				<th width="25%"> City </th>
				<th width="25%"> State </th>
				<th width="10%"> Nat </th>
				<th width="7.5%">  </th>
				<th width="7.5%">  </th>
			</tr>
		</thead>
		<tbody>
		</tbody>
	</table>
	
		
	<div id="detailsContainer">
		<div id="details">
		</div>
		<div id="navButtons">
			<input type="button" value="Primo">
			<input type="button" value="Indietro">
			<p id="navLabel"> 1/4 </p>
			<input type="button" value="Avanti">
			<input type="button" value="Ultimo">
		</div>
	</div>


	<!-- Finestra Modale che all'inizio è automaticamente nascosta -->
	<dialog id="addNewModal">
		<h2>Aggiungi una persona</h2>
		<div class="form-row">
		  <div class="form-group">
			<label for="txtFirst">Nome</label>
			<input type="text" id="txtFirst" placeholder="Es. Mario">
		  </div>
		  <div class="form-group">
			<label for="txtLast">Cognome</label>
			<input type="text" id="txtLast" placeholder="Es. Rossi">
		  </div>
		</div>

		<!-- Riga 2: Città e Stato -->
		<div class="form-row">
		  <div class="form-group">
			<label for="txtCity">Città</label>
			<input type="text" id="txtCity" placeholder="Es. Roma">
		  </div>
		  <div class="form-group">
			<label for="txtState">Provincia / Stato</label>
			<input type="text" id="txtState" placeholder="Es. RM">
		  </div>
		</div>

		<!-- Riga 3: Nazionalità (singola colonna espansa o mantenuta in riga) -->
		<div class="form-row">
		  <div class="form-group">
			<label for="txtNat">Nazionalità</label>
			<input type="text" id="txtNat" placeholder="Es. Italiana">
		  </div>
		  <div class="form-group">
			<!-- Spazio vuoto o un altro campo se serve in futuro -->
		  </div>
		</div>

		<!-- Contatti -->
		<div class="form-group">
		  <label for="txtEmail">Email</label>
		  <input type="email" id="txtEmail" placeholder="mario.rossi@example.com">
		</div>

		<div class="form-group">
		  <label for="txtPhone">Telefono</label>
		  <input type="tel" id="txtPhone" placeholder="Es. +39 333 1234567">
		</div>

		<!-- Pulsanti di azione -->
		<div class="modal-actions">
		  <button type="button" id="btnAnnulla" class="btn-secondary">Annulla</button>
		  <button type="button" id="btnSalva" class="btn-primary">Salva</button>
		</div>
	</dialog>
		
	<div id="utilityButtons">
		<input type="button" value="Elimina Per Nazione">
		<input type="button" value="Ordina">
		<input type="button" value="Salva">
		<input type="button" value="New">
	<div>
		
</body>
</html>
